name: Build and validate the static studio
description: Shared source, editor, native-artifact and real-browser checks for CI and FTP publication.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '24'
        cache: npm
    - name: Install pinned dependencies
      shell: bash
      run: npm ci
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: build-work/editor-upstream
        key: ${{ runner.os }}-editor-engines-${{ hashFiles('apps/studio/editor/engines.lock.json') }}
    - name: Restore pinned native release and verify sources
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/restore-deployment-engine.py
    - name: Build editors, verify source checks and assemble static files
      shell: bash
      run: |
        node scripts/build-school.mjs --check
        npm run editor:build
        npm test
        cc -std=c11 -Wall -Wextra -Werror -fsyntax-only -x c packages/sql-native/include/pbl_sql.h
        python3 -m compileall -q scripts
        python3 -m unittest discover -s tests -p 'test_native_concurrency.py' -v
        node scripts/package-studio.mjs
        python3 scripts/verify-studio-legal.py build-work/site
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-studio-playwright-1.64.1
    - name: Install pinned real browsers
      shell: bash
      run: |
        mkdir -p build-work/php
        npm install --prefix build-work/php --no-package-lock --ignore-scripts playwright@1.64.1
        build-work/php/node_modules/.bin/playwright install --with-deps --only-shell chromium firefox
    - name: Validate the shipped static package in Chromium and Firefox
      shell: bash
      run: |
        node tests/browser/site-package.mjs
        node tests/browser/site-updates.mjs
    - name: Validate language services, code and SQL editors, native APIs and accessibility
      shell: bash
      run: |
        node tests/browser/editor-services.mjs
        node tests/browser/editor-intelligence.mjs
        node tests/browser/alwis-workbench.mjs
        node tests/browser/mysqli-complete.mjs
        node tests/browser/database-stability.mjs
        node tests/browser/data-integrity.mjs
        node tests/browser/alwis-accessibility.mjs
        node tests/browser/keyboard.mjs
        node tests/browser/workspace-design.mjs
        node tests/browser/constraint-feedback.mjs
        node tests/browser/schema-hints.mjs
        node tests/browser/input-feedback.mjs
        node tests/browser/mixed-format.mjs
        node tests/browser/ux-revision.mjs
        node tests/browser/preview-browser.mjs
        node tests/browser/ui-refinement.mjs
        node tests/browser/launcher.mjs
        node tests/browser/folder-opening.mjs
        node tests/browser/zip-selection.mjs
        ALWIS_STORAGE_MEMORY=1 node tests/browser/disk-storage.mjs
        node tests/browser/disk-migration.mjs
        node tests/browser/project-loading.mjs
        node tests/browser/project-loading.mjs firefox
