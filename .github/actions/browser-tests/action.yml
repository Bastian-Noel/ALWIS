name: Prepare pinned browser tests
description: Shared Playwright downloads for Studio, native and isolated guest tests.
runs:
  using: composite
  steps:
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-studio-playwright-1.64.1
    - shell: bash
      run: |
        # The Azure HTTP mirror can stall each font download on fresh runners.
        # Keep Ubuntu's signed packages, using its official HTTPS archive.
        if [ -f /etc/apt/apt-mirrors.txt ]; then
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
        fi
        mkdir -p build-work/php
        npm install --prefix build-work/php --no-package-lock --ignore-scripts playwright@1.64.1
        build-work/php/node_modules/.bin/playwright install --only-shell chromium firefox
        # Ubuntu runners already provide the browsers' shared libraries in most images.
        # Probe both actual pinned binaries; install OS packages only when necessary.
        if ! node --input-type=module <<'JS'
        import { chromium, firefox } from './build-work/php/node_modules/playwright/index.mjs';
        for (const type of [chromium, firefox]) {
          const browser = await type.launch({ headless: true, args: type === chromium ? ['--no-sandbox'] : [] });
          await browser.close();
        }
        JS
        then
          build-work/php/node_modules/.bin/playwright install-deps chromium firefox
        fi
