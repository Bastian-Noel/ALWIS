name: Native upstream baseline
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-baseline.yml'
permissions:
  contents: read
concurrency:
  group: native-baseline
  # A new source-build revision supersedes a running older workflow (saves CI minutes).
  cancel-in-progress: true
jobs:
  mariadb:
    name: MariaDB ${{ matrix.variant }} from source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [original-compat, bridge]
    env:
      JOBS: '2'
      # Dedicated caches per MariaDB build variant: no shared mutable paths.
      EM_CACHE: ${{ github.workspace }}/.cache/mariadb-${{ matrix.variant }}-emscripten
      CCACHE_DIR: ${{ github.workspace }}/.cache/mariadb-${{ matrix.variant }}-ccache
      CCACHE_MAXSIZE: 600M
      CCACHE_COMPILERCHECK: content
      EM_COMPILER_WRAPPER: ccache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: joomengine/mariadb-wasm-bridge
          ref: 56d47b4dc867af313592efa09e12df470a36e129
          path: build-work/bridge
      - uses: actions/checkout@v4
        with:
          repository: emscripten-core/emsdk
          ref: d7b4130688bfa348392b921ab04015aa15c4f154
          path: build-work/emsdk
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: build-work/bridge/package-lock.json
      - name: Restore versioned MariaDB compiler caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/mariadb-${{ matrix.variant }}-emscripten
            .cache/mariadb-${{ matrix.variant }}-ccache
          key: ${{ runner.os }}-mariadb-${{ matrix.variant }}-emsdk-6.0.6-v1-${{ hashFiles('provenance/upstream-lock.json', 'engine/baseline/compat/*.patch') }}
          restore-keys: |
            ${{ runner.os }}-mariadb-${{ matrix.variant }}-emsdk-6.0.6-v1-
      - name: Install matching toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ccache build-essential cmake bison libssl-dev libpcre2-dev libncurses-dev autoconf automake re2c libtool pkg-config
          build-work/emsdk/emsdk install 6.0.6
          build-work/emsdk/emsdk activate 6.0.6
      - name: Compile MariaDB original with isolated compiler-compatibility patch
        if: matrix.variant == 'original-compat'
        run: |
          set -o pipefail
          source build-work/emsdk/emsdk_env.sh
          git clone --no-checkout https://github.com/shyim/lite4mariadb.git build-work/mariadb
          git -C build-work/mariadb checkout --detach 24be9371a2f6c71250a2356631ad6feab2280b02
          mkdir -p build-work/logs
          # Pure original failed on 2026-10-31, run 41197139983; keep that immutable receipt.
          # This compatibility-only include is applied to a disposable checkout, never the source snapshots.
          sha256sum engine/baseline/compat/0001-get-password-ctype.patch | tee build-work/logs/mariadb-original-patch.sha256
          git -C build-work/mariadb apply --check "$GITHUB_WORKSPACE/engine/baseline/compat/0001-get-password-ctype.patch"
          git -C build-work/mariadb apply "$GITHUB_WORKSPACE/engine/baseline/compat/0001-get-password-ctype.patch"
          git -C build-work/mariadb diff --check
          git -C build-work/mariadb diff -- mysys/get_password.c > build-work/logs/mariadb-original-applied.diff
          # Validate the tiny compiler-only change BEFORE downloading large native submodules.
          git -C build-work/mariadb submodule update --init --depth 1 libmariadb extra/wolfssl/wolfssl
          (cd build-work/mariadb && /usr/bin/time -v bash wasm/build.sh) 2>&1 | tee build-work/logs/mariadb-original-build.log
          (cd build-work/mariadb/wasm && npm test) 2>&1 | tee build-work/logs/mariadb-original-tests.log
      - name: Compile bridge engine using only its upstream patch
        if: matrix.variant == 'bridge'
        run: |
          set -o pipefail
          source build-work/emsdk/emsdk_env.sh
          mkdir -p build-work/logs
          (cd build-work/bridge && /usr/bin/time -v node scripts/build-engine.mjs) 2>&1 | tee build-work/logs/mariadb-bridge-build.log
      - name: Compile PDO and exercise real browser MariaDB
        if: matrix.variant == 'bridge'
        run: |
          set -o pipefail
          source build-work/emsdk/emsdk_env.sh
          cd build-work/bridge
          npm ci --ignore-scripts
          npx playwright install --only-shell chromium firefox
          npm run build:upstream -- 8.4 2>&1 | tee ../logs/pdo-build.log
          PHP_WASM_VERSIONS=8.4 npm run test:upstream 2>&1 | tee ../logs/pdo-node-tests.log
          npm run test:integration 2>&1 | tee ../logs/mariadb-integration.log
          BRIDGE_BROWSERS=chromium,firefox npm run test:browser 2>&1 | tee ../logs/mariadb-browser.log
      - name: Report MariaDB compiler cache usage
        if: always()
        run: |
          mkdir -p build-work/logs
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats 2>&1 | tee build-work/logs/mariadb-${{ matrix.variant }}-ccache-stats.log
          else
            echo "ccache not installed" | tee build-work/logs/mariadb-${{ matrix.variant }}-ccache-stats.log
          fi
      - name: Retain compiled outputs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-mariadb-${{ matrix.variant }}
          include-hidden-files: true
          retention-days: 90
          path: |
            build-work/logs/
            build-work/mariadb/wasm/dist/
            build-work/bridge/.native-build/engine/dist/
            build-work/bridge/.native-build/upstream/php*-pdo-mariadb-wasm.*
  php:
    name: PHP 8.4 JoomEngine source build and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PHP_WASM_VERSION: '8.4'
      PHP_WASM_MANIFEST: dist/runtime-manifest.json
      PHP_WASM_BROWSERS: chromium,firefox
      SOURCE_DATE_EPOCH: '0'
      JOBS: '2'
      EM_CACHE: ${{ github.workspace }}/.cache/php-emscripten
      CCACHE_DIR: ${{ github.workspace }}/.cache/php-ccache
      CCACHE_MAXSIZE: 600M
      CCACHE_COMPILERCHECK: content
      EM_COMPILER_WRAPPER: ccache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: joomengine/php-wasm
          ref: 3b8cef42c020fbcbb6b41fad86716b7c8664b55b
          path: build-work/php
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: build-work/php/package-lock.json
      - name: Restore versioned PHP compiler caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/php-emscripten
            .cache/php-ccache
          key: ${{ runner.os }}-php-8.4-emsdk-6.0.6-v1-${{ hashFiles('provenance/upstream-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-emsdk-6.0.6-v1-
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ccache build-essential autoconf automake libtool pkg-config bison re2c cmake ninja-build jq curl xz-utils unzip
      - name: Build PHP and dependencies with upstream recipe
        run: |
          set -o pipefail
          mkdir -p build-work/logs
          cd build-work/php
          npm ci --ignore-scripts
          bash build/setup-emsdk.sh "$RUNNER_TEMP/emsdk"
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          /usr/bin/time -v bash build/build.sh "$PHP_WASM_VERSION" 2>&1 | tee ../logs/php-build.log
          node scripts/manifest.mjs --php "$PHP_WASM_VERSION"
      - name: Test PHP and PDO in Node and browsers
        run: |
          set -o pipefail
          cd build-work/php
          npm run test:integration 2>&1 | tee ../logs/php-node.log
          npm run prepare:mariadb 2>&1 | tee ../logs/php-mariadb-prepare.log
          npm run test:database 2>&1 | tee ../logs/php-database-node.log
          npx playwright install --only-shell chromium firefox
          npm run test:browser 2>&1 | tee ../logs/php-browser.log
          npm run test:database:browser 2>&1 | tee ../logs/php-database-browser.log
          node scripts/test-receipt.mjs "$PHP_WASM_VERSION"
      - name: Report PHP compiler cache usage
        if: always()
        run: |
          mkdir -p build-work/logs
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats 2>&1 | tee build-work/logs/php-ccache-stats.log
          else
            echo "ccache not installed" | tee build-work/logs/php-ccache-stats.log
          fi
      - name: Retain PHP outputs, versions and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-php-8.4
          retention-days: 90
          path: |
            build-work/php/dist/
            build-work/php/versions.json
            build-work/logs/
