name: Publish ALWIS server container
on:
  workflow_run:
    workflows: ["Publish FTP - validated studio"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      static_run_id:
        description: GitHub Actions run ID of the successful static publication
        type: string
        required: true
      source_sha:
        description: Exact main commit used by that static publication
        type: string
        required: true
permissions:
  actions: read
  contents: write
  packages: write
concurrency:
  group: alwis-server-container
  cancel-in-progress: false
jobs:
  container:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact static release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.source_sha }}
          persist-credentials: false
      - name: Download the validated static artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.static_run_id }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || inputs.source_sha }}
        run: gh run download "$RUN_ID" --repo "$GH_REPO" --name "studio-static-$SOURCE_SHA" --dir build-work/server-site
      - name: Verify the static release artifact
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || inputs.source_sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('build-work/server-site')
          release = json.loads((root / 'release.json').read_text())
          package = json.loads(Path('package.json').read_text())
          if release['revision'] != os.environ['SOURCE_SHA']:
              raise SystemExit('Static artifact revision does not match its validated source run.')
          if release['version'] != package['version'] or release['workingChanges']:
              raise SystemExit('Static artifact version or clean-source check failed.')
          for item in release['files']:
              data = (root / item['path']).read_bytes()
              if len(data) != item['bytes'] or hashlib.sha256(data).hexdigest() != item['sha256']:
                  raise SystemExit('Static artifact checksum mismatch: ' + item['path'])
          print('Verified', len(release['files']), 'static files for', release['version'], release['revision'])
          PY
      - name: Build the isolated server image
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || inputs.source_sha }}
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          TAG="${VERSION}"
          PACKAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/alwis-server"
          SHORT_SHA="${SOURCE_SHA:0:12}"
          docker build --pull --platform linux/amd64 \
            --build-arg "ALWIS_VERSION=$VERSION" \
            --build-arg "ALWIS_REVISION=$SOURCE_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "$PACKAGE:$TAG" \
            --tag "$PACKAGE:sha-$SHORT_SHA" \
            --file server/Dockerfile .
          printf '%s\n' "$PACKAGE" > build-work/server-image-name.txt
          printf '%s\n' "$VERSION" > build-work/server-image-version.txt
          printf '%s\n' "$SOURCE_SHA" > build-work/server-image-source.txt
      - name: Publish the server container to GitHub Packages
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          PACKAGE=$(cat build-work/server-image-name.txt)
          VERSION=$(cat build-work/server-image-version.txt)
          SHORT_SHA="${SOURCE_SHA:0:12}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$PACKAGE:$VERSION"
          docker push "$PACKAGE:sha-$SHORT_SHA"
          if gh api --method PATCH "/user/packages/container/alwis-server/visibility" -f visibility=public >/dev/null 2>&1; then
            echo 'The GHCR package is public.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::warning::The image was pushed, but GITHUB_TOKEN cannot change GHCR visibility. Make the package public once in its GitHub package settings if anonymous pulls are required.'
            printf '%s\n' 'The GHCR package was pushed. Anonymous pulls may require setting its visibility to Public under GitHub → Packages → alwis-server → Package settings.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Add the container pull command to the matching release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(cat build-work/server-image-version.txt)
          PACKAGE=$(cat build-work/server-image-name.txt)
          SOURCE_SHA=$(cat build-work/server-image-source.txt)
          TAG="v$VERSION"
          gh release view "$TAG" --repo "$GH_REPO" --json body --jq .body > build-work/server-release-notes.md
          printf '\n### Server container\n\nPull the server edition with `docker pull %s:%s`. If GitHub returns an access error, make the package public in GitHub Packages or authenticate with `docker login ghcr.io`. Source: `%s`. See [the server deployment guide](https://github.com/%s/blob/main/docs/server-deployment.md).\n' \
            "$PACKAGE" "$VERSION" "$SOURCE_SHA" "$GH_REPO" >> build-work/server-release-notes.md
          gh release edit "$TAG" --repo "$GH_REPO" --notes-file build-work/server-release-notes.md
