name: Publish ALWIS server container
on:
  workflow_run:
    workflows: ["Publish FTP - validated studio"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      static_run_id:
        description: GitHub Actions run ID of the successful static publication
        type: string
        required: false
      source_sha:
        description: Exact main commit used by that static publication
        type: string
        required: false
      image_version:
        description: Retag an already published version as latest without rebuilding
        type: string
        required: false
permissions:
  actions: read
  contents: write
  packages: write
concurrency:
  group: alwis-server-container
  cancel-in-progress: false
jobs:
  container:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.image_version == '') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require the static publication inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          RUN_ID: ${{ inputs.static_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: test -n "$RUN_ID" && test -n "$SOURCE_SHA"
      - name: Check out the exact static release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.source_sha }}
          persist-credentials: false
      - name: Download the validated static artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.static_run_id }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || inputs.source_sha }}
        run: gh run download "$RUN_ID" --repo "$GH_REPO" --name "studio-static-$SOURCE_SHA" --dir build-work/server-site
      - name: Verify the static release artifact
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || inputs.source_sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('build-work/server-site')
          release = json.loads((root / 'release.json').read_text())
          licensing = json.loads((root / 'RELEASE-LICENSING-STATUS.json').read_text())
          if licensing.get('status') != 'ready' or licensing.get('blockers'):
              raise SystemExit('Server image publication is blocked by licensing status: ' + '; '.join(item['summary'] for item in licensing.get('blockers', [])))
          package = json.loads(Path('package.json').read_text())
          if release['revision'] != os.environ['SOURCE_SHA']:
              raise SystemExit('Static artifact revision does not match its validated source run.')
          if release['version'] != package['version'] or release['workingChanges']:
              raise SystemExit('Static artifact version or clean-source check failed.')
          for item in release['files']:
              data = (root / item['path']).read_bytes()
              if len(data) != item['bytes'] or hashlib.sha256(data).hexdigest() != item['sha256']:
                  raise SystemExit('Static artifact checksum mismatch: ' + item['path'])
          print('Verified', len(release['files']), 'static files for', release['version'], release['revision'])
          PY
      - name: Set up QEMU for ARM64 builds
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0
      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish the multi-architecture server image
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || inputs.source_sha }}
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          TAG="${VERSION}"
          PACKAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/alwis-server"
          SHORT_SHA="${SOURCE_SHA:0:12}"
          docker buildx build --pull --platform linux/amd64,linux/arm64 --push \
            --cache-from type=gha,scope=alwis-server \
            --cache-to type=gha,mode=max,scope=alwis-server \
            --build-arg "ALWIS_VERSION=$VERSION" \
            --build-arg "ALWIS_REVISION=$SOURCE_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "$PACKAGE:$TAG" \
            --tag "$PACKAGE:sha-$SHORT_SHA" \
            --tag "$PACKAGE:latest" \
            --file server/Dockerfile .
          printf '%s\n' "$PACKAGE" > build-work/server-image-name.txt
          printf '%s\n' "$VERSION" > build-work/server-image-version.txt
          printf '%s\n' "$SOURCE_SHA" > build-work/server-image-source.txt
      - name: Set the server container package visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PACKAGE=$(cat build-work/server-image-name.txt)
          if gh api --method PATCH "/user/packages/container/alwis-server/visibility" -f visibility=public >/dev/null 2>&1; then
            echo 'The GHCR package is public.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::warning::The image was pushed, but GITHUB_TOKEN cannot change GHCR visibility. Make the package public once in its GitHub package settings if anonymous pulls are required.'
            printf '%s\n' 'The GHCR package was pushed. Anonymous pulls may require setting its visibility to Public under GitHub → Packages → alwis-server → Package settings.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Add the container pull command to the matching release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(cat build-work/server-image-version.txt)
          PACKAGE=$(cat build-work/server-image-name.txt)
          SOURCE_SHA=$(cat build-work/server-image-source.txt)
          TAG="v$VERSION"
          gh release view "$TAG" --repo "$GH_REPO" --json body --jq .body > build-work/server-release-notes.md
          awk '/^### Server container$/ {exit} {print}' build-work/server-release-notes.md > build-work/server-release-notes-updated.md
          mv build-work/server-release-notes-updated.md build-work/server-release-notes.md
          printf '\n### Server container\n\nPull the latest server edition with `docker pull %s:latest`, or pin this release with `docker pull %s:%s`. Browse tags and package settings in [GitHub Packages](https://github.com/%s/pkgs/container/alwis-server). If GitHub returns an access error, make the package public or authenticate with `docker login ghcr.io`. Source: `%s`. See [deployment instructions](https://github.com/%s/wiki/Publication).\n' \
            "$PACKAGE" "$PACKAGE" "$VERSION" "$GH_REPO" "$SOURCE_SHA" "$GH_REPO" >> build-work/server-release-notes.md
          gh release edit "$TAG" --repo "$GH_REPO" --notes-file build-work/server-release-notes.md
  latest-alias:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.image_version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the licensing status
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require a ready licensing review
        run: |
          python3 - <<'PY'
          import json,pathlib
          record=json.loads(pathlib.Path('provenance/release-licensing-status.json').read_text())
          if record.get('status')!='ready' or record.get('blockers'):
              raise SystemExit('Container alias update blocked by licensing status: '+'; '.join(item.get('summary',item.get('id','unknown blocker')) for item in record.get('blockers',[])))
          PY
      - name: Validate existing version tag
        env:
          VERSION: ${{ inputs.image_version }}
        run: |
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo 'Enter a valid existing container version tag.' >&2
            exit 1
          fi
      - name: Retag the existing published image
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.image_version }}
          GH_REPO: ${{ github.repository }}
        run: |
          PACKAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/alwis-server"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker pull "$PACKAGE:$VERSION"
          docker tag "$PACKAGE:$VERSION" "$PACKAGE:latest"
          docker push "$PACKAGE:latest"
          TAG="v$VERSION"
          gh release view "$TAG" --repo "$GH_REPO" --json body --jq .body > server-release-notes.md
          awk '/^### Server container$/ {exit} {print}' server-release-notes.md > server-release-notes-updated.md
          printf '\n### Server container\n\nPull the latest server edition with `docker pull %s:latest`, or pin this release with `docker pull %s:%s`. Browse tags and package settings in [GitHub Packages](https://github.com/%s/pkgs/container/alwis-server). See [deployment instructions](https://github.com/%s/wiki/Publication).\n' \
            "$PACKAGE" "$PACKAGE" "$VERSION" "$GH_REPO" "$GH_REPO" >> server-release-notes-updated.md
          gh release edit "$TAG" --repo "$GH_REPO" --notes-file server-release-notes-updated.md
