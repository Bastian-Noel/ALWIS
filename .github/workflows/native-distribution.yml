name: Publish verified native distribution
on:
  workflow_dispatch:
    inputs:
      artifact_run:
        description: Successful main workflow run containing a native-distribution artifact (no upload branch)
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download a validated main artifact without creating Git references
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT_RUN: ${{ inputs.artifact_run }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          python3 - <<'PYVERIFY'
          import json,os,subprocess
          run=os.environ['ARTIFACT_RUN']
          assert run.isdigit()
          record=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GH_REPO']+'/actions/runs/'+run]))
          assert record['head_branch']=='main' and record['conclusion']=='success'
          PYVERIFY
          gh run download "$ARTIFACT_RUN" --name native-distribution --dir deployment/native
      - name: Verify source manifest and upload immutable distribution
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib,subprocess
          root=pathlib.Path('deployment/native')
          licensing=json.loads(pathlib.Path('provenance/release-licensing-status.json').read_text())
          assert licensing.get('status')=='ready' and not licensing.get('blockers'), 'Native release blocked by licensing status: '+'; '.join(item.get('summary',item.get('id','unknown blocker')) for item in licensing.get('blockers',[]))
          lock=json.loads(pathlib.Path('config/native-runtime.json').read_text())
          data=(root/'artifact.json').read_bytes()
          assert hashlib.sha256(data).hexdigest()==lock['manifestSha256']
          manifest=json.loads(data)
          assert manifest.get('licensing',{}).get('status')=='ready', 'Native artifact manifest does not record ready licensing status.'
          revision=manifest.get('sourceRevision','')
          assert len(revision)==40 and all(ch in '0123456789abcdef' for ch in revision), 'Invalid native source revision'
          for record in manifest['sourceFiles']:
              path=lock.get('sourceRelocations',{}).get(record['path'],record['path'])
              assert not path.startswith('/') and '..' not in pathlib.Path(path).parts, 'Invalid source path'
              historical=subprocess.run(['git','show',revision+':'+path],capture_output=True)
              assert historical.returncode==0 and hashlib.sha256(historical.stdout).hexdigest()==record['sha256'], 'Source does not match native build: '+path
          receipt=manifest.get('independentAdapter',{})
          assert receipt.get('adapter')=='ALWIS cooperative waits (independent candidate)' and len(receipt.get('files',[]))==3, 'Unverified independent native adapter'
          bundle=manifest.get('correspondingSources',{})
          expected_sources={'shyim/lite4mariadb','php/php-src','php/php-release','PCRE2Project/pcre2','seanmorris/php-wasm','MariaDB/mariadb-connector-c','wolfSSL/wolfssl'}
          upstream=bundle.get('archives',[])
          assert bundle.get('name')=='corresponding-sources.tar.gz' and len(upstream)==7 and {row.get('repo') for row in upstream}==expected_sources, 'Missing or unknown corresponding sources'
          assert bundle.get('historicalJoomEngineForkIncluded') is False, 'Legacy fork is not eligible for independent native release'
          assert len(bundle.get('patchedMariaDBFiles',[]))==3, 'Missing modified source file references'
          # Disallow a historical build dressed as an independent bundle.
          runner=manifest.get('build',{}).get('independentPhpRunner',{})
          assert runner and runner==bundle.get('independentPhpRunner'), 'Missing independent PHP runner source identity'
          assert any(item.get('path')=='packages/php-native/src/runner.c' and item.get('sha256')==runner.get('sourceSha256') for item in manifest.get('sourceFiles',[])), 'Runtime does not list its independent runner source'
          assert any(item.get('name')=='runtime.c' and item.get('sha256')==runner.get('sourceSha256') for item in runner.get('generatedFiles',[])), 'Compiled PHP wrapper does not match ALWIS runner'
          fiber=bundle.get('phpFiberAdapter',{})
          assert fiber.get('phpVersion')=='8.4.27' and len(fiber.get('zendAfterSha256',''))==64, 'PHP Zend fiber source receipt missing'
          assert fiber==manifest.get('build',{}).get('phpFiberAdapter'), 'Compiled PHP Zend fiber source not pinned to bundle'
          assert manifest['files']['pbl-runtime.wasm']['sha256']!='80df46b7b308b33475fde138eb1a295c01ffbf6ac685d17a74209eb224674e0f', 'Historical native WASM prohibited'
          source_data=(root/bundle['name']).read_bytes()
          assert len(source_data)==bundle['bytes'] and hashlib.sha256(source_data).hexdigest()==bundle['sha256'], 'Corresponding sources checksum mismatch'
          for name,record in manifest['files'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==record['sha256']
          license_records=manifest.get('licensing',{}).get('files',[])
          license_paths=[record['path'] for record in license_records]
          assert license_paths, 'Native artifact manifest has no license or notice file records.'
          for record in license_records:
              path=root/record['path']
              assert path.is_file() and path.stat().st_size==record['bytes'] and hashlib.sha256(path.read_bytes()).hexdigest()==record['sha256'], 'Native release license/notice checksum mismatch: '+record['path']
          release_files=['artifact.json','pbl-runtime.mjs','pbl-runtime.wasm',bundle['name'],*license_paths]
          (root/'SHA256SUMS').write_text(''.join(hashlib.sha256((root/name).read_bytes()).hexdigest()+'  '+name+'\n' for name in release_files))
          (root/'release-files.txt').write_text('\n'.join(release_files+['SHA256SUMS'])+'\n')
          PY
          tag=$(python3 -c "import json;print(json.load(open('config/native-runtime.json'))['release'])")
          while IFS= read -r path; do gh release upload "$tag" "deployment/native/$path" --clobber; done < deployment/native/release-files.txt
          gh release edit "$tag" --draft=false
