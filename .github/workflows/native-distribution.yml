name: Publish verified native distribution
on:
  workflow_dispatch:
    inputs:
      artifact_ref:
        description: Immutable commit containing artifact.json and the validated native files
        required: true
        type: string
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.artifact_ref }}
          path: deployment/native
      - name: Verify source manifest and upload immutable distribution
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib
          root=pathlib.Path('deployment/native')
          lock=json.loads(pathlib.Path('config/native-runtime.json').read_text())
          data=(root/'artifact.json').read_bytes()
          assert hashlib.sha256(data).hexdigest()==lock['manifestSha256']
          manifest=json.loads(data)
          for record in manifest['sourceFiles']:
              path=pathlib.Path(lock['sourceRelocations'].get(record['path'],record['path']))
              assert hashlib.sha256(path.read_bytes()).hexdigest()==record['sha256'],str(path)
          for name,record in manifest['files'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==record['sha256']
          (root/'SHA256SUMS').write_text(''.join(hashlib.sha256((root/name).read_bytes()).hexdigest()+'  '+name+'\n' for name in ['artifact.json','pbl-runtime.mjs','pbl-runtime.wasm']))
          PY
          tag=$(python3 -c "import json;print(json.load(open('config/native-runtime.json'))['release'])")
          gh release upload "$tag" deployment/native/artifact.json deployment/native/pbl-runtime.mjs deployment/native/pbl-runtime.wasm deployment/native/SHA256SUMS
