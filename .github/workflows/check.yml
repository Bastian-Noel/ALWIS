name: CI - validated studio
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/validated-studio
      - name: Retain the exact validated static site for publication
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: studio-static-${{ github.sha }}
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: error
          path: build-work/site/
      - name: Retain validation receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: studio-validation-${{ github.sha }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build-work/site-smoke.json
            build-work/site-updates.json
            build-work/disk-storage/results.json
            build-work/disk-storage/global-memory.json
            build-work/studio-ui/chromium.json
            apps/studio/receipts/alwis/*.json
            apps/studio/receipts/alwis/*.png
            apps/studio/receipts/ide/*.json
            apps/studio/receipts/ide/*.png
            apps/studio/receipts/editor/*.json
            apps/studio/receipts/editor/*.png
            engine/fusion/receipts/mysqli-complete/*.json
            engine/fusion/receipts/database-stability/*.json
