name: QA - FTP and Docker packages from verified independent WASM
on:
  push:
    branches: ['develop/2026-11-beta1-foundation']
    paths: ['config/independent-native-qa.json']
permissions:
  contents: read
  actions: read
jobs:
  qa-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build-work/editor-upstream
          key: ${{ runner.os }}-editor-engines-${{ hashFiles('apps/studio/editor/engines.lock.json') }}
      - name: Restore independently rebuilt binary and its matching sources (no old release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/restore_independent_native_qa.py
      - name: Build static site and assert exact new WASM plus legal notices
        run: |
          node scripts/build-school.mjs --check
          npm run editor:build
          npm test
          node scripts/package-studio.mjs
          python3 scripts/verify-studio-legal.py build-work/site
          python3 scripts/verify-editor-boundary.py build-work/site
          python3 - <<'PY'
          import json
          from pathlib import Path
          site=Path('build-work/site')
          record=json.loads((site/'release.json').read_text())
          lock=json.loads(Path('config/independent-native-qa.json').read_text())
          wasm=next(row for row in record['files'] if row['path'].endswith('/engine/pbl-runtime.wasm'))
          assert wasm['sha256']==lock['wasmSha256'] and not record['workingChanges']
          assert json.loads((site/'RELEASE-LICENSING-STATUS.json').read_text())['status']=='blocked'
          print('Independent static package verified, NOT approved for publication')
          PY
      - name: Prepare offline FTP payload and build local Docker QA image
        run: |
          mkdir -p build-work/server-site
          cp -a build-work/site/. build-work/server-site/
          tar -czf build-work/independent-studio-qa.tar.gz -C build-work/site .
          docker build -f server/Dockerfile -t alwis-server:qa-only \
            --build-arg ALWIS_VERSION=2026.11.0-beta.1 \
            --build-arg ALWIS_REVISION=$GITHUB_SHA .
          docker image inspect alwis-server:qa-only --format '{{.Id}}'
      - name: Verify QA Docker health and exact new WASM over localhost
        run: |
          docker run --detach --name alwis-independent-qa --publish 127.0.0.1::3000             --env ALWIS_ADMIN_PASSWORD=qa-container-only-long-password             --env PUBLIC_BASE_URL=http://localhost:3000 alwis-server:qa-only
          for attempt in $(seq 1 40); do
            if docker inspect alwis-independent-qa --format '{{.State.Health.Status}}' | grep -q healthy; then break; fi
            sleep 2
          done
          test "$(docker inspect alwis-independent-qa --format '{{.State.Health.Status}}')" = healthy
          HOST_PORT=$(docker port alwis-independent-qa 3000/tcp | awk -F: '{print $NF}')
          curl --fail --silent --show-error "http://127.0.0.1:$HOST_PORT/readyz"
          EXPECTED=$(python3 -c "import json;print(json.load(open('config/independent-native-qa.json'))['wasmSha256'])")
          ACTUAL=$(curl --fail --silent --show-error             "http://127.0.0.1:$HOST_PORT/_alwis/$GITHUB_SHA/engine/pbl-runtime.wasm" | sha256sum | cut -d' ' -f1)
          test "$ACTUAL" = "$EXPECTED"
          echo "QA Docker healthy and independent WASM verified; no registry push or FTP transfer."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: independent-studio-qa-not-a-release
          retention-days: 7
          if-no-files-found: error
          path: |
            build-work/independent-studio-qa.tar.gz
            build-work/site/release.json
