name: 06 - Publication - FTP
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release à créer avant le transfert FTP (ex. v2026.11.0-beta.1)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: studio-ftp-publication
  cancel-in-progress: false
jobs:
  preflight:
    name: Release authorization (licenses and version)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate requested version and distribution rights BEFORE downloading or publishing
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: python3 scripts/check-release-licensing.py
  build:
    name: Reuse successful CI package
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reuse the exact successful main CI build, without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: python3 scripts/verify-ci-artifact.py
      - name: Retain validated static package in the publication run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: studio-static-${{ github.sha }}
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: error
          path: build-work/site/
  release:
    name: Create immutable GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Publish the validated release before changing the FTP site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.version }}
          VALIDATED_RUN: ${{ github.run_id }}
          RELEASE_BEFORE_FTP: 'true'
        run: python3 scripts/release-validated-site.py
  publish:
    name: Transfer exactly released package over FTP
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download the exact package already published in the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --name "studio-static-$GITHUB_SHA" --dir build-work/site
      - name: Publish through passive FTP
        env:
          FTP_HOST: '141.253.111.13'
          FTP_PORT: '21'
          FTP_USERNAME: studio
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR || '.' }}
          FTP_PUBLIC_URL: ${{ vars.FTP_PUBLIC_URL || 'https://studio.mmi.place/' }}
        run: python3 scripts/deploy-static-ftp.py build-work/site
      - name: Record the successful FTP deployment on the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.version }}
        run: python3 scripts/record-ftp-release.py
      - name: Retain previous files privately for recovery
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ftp-previous-site-${{ github.run_id }}
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: ignore
          path: ${{ runner.temp }}/ftp-previous-site/
