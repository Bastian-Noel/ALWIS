name: Measure compiled upstream baseline
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Native upstream baseline run ID
        required: true
        type: string
  workflow_run:
    workflows: ['Native upstream baseline']
    types: [completed]
  # Harness-only changes use the latest successful native artifacts; no rebuild.
  push:
    branches: [main]
    paths:
      - 'benchmarks/baseline-browser.mjs'
      - '.github/workflows/baseline-measurements.yml'
permissions:
  contents: read
  actions: read
jobs:
  measure:
    # A successful PHP artifact is usable even when the independent original-MariaDB job fails.
    # Fail honestly if that PHP artifact is absent; do not skip all measurements silently.
    if: github.event_name != 'workflow_run' || contains(fromJSON('["success","failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PHP_WASM_VERSION: '8.4'
      PHP_WASM_BROWSERS: chromium,firefox
      BASELINE_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: joomengine/php-wasm
          ref: 3b8cef42c020fbcbb6b41fad86716b7c8664b55b
          path: build-work/php
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reuse latest successful native build without recompiling
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/native-baseline.yml/runs?branch=main&status=success&per_page=10" --jq '.workflow_runs[0].id')
          [[ "$id" =~ ^[0-9]+$ ]] || { echo 'No successful native artifact run'; exit 1; }
          echo "BASELINE_RUN_ID=$id" >> "$GITHUB_ENV"
          echo "Reuse compiled native build run $id"
      - uses: actions/download-artifact@v4
        with:
          name: baseline-php-8.4
          path: build-work
          run-id: ${{ env.BASELINE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Prepare pinned browser and database dependencies
        run: |
          cd build-work/php
          npm ci --ignore-scripts
          npm run prepare:mariadb
          npx playwright install --only-shell chromium firefox
          test -s dist/php/8.4/php.wasm
      - name: Measure real PHP and SQL and verify response contents
        run: |
          set -o pipefail
          mkdir -p benchmarks/results
          git rev-parse HEAD > benchmarks/results/harness-commit.txt
          printf '%s\n' "$BASELINE_RUN_ID" > benchmarks/results/build-run.txt
          cd build-work/php
          BENCHMARK_OUTPUT="$GITHUB_WORKSPACE/benchmarks/results" node ../../benchmarks/baseline-browser.mjs 2>&1 | tee ../../benchmarks/results/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-browser-measurements
          path: benchmarks/results/
          if-no-files-found: error
          retention-days: 90
