name: 04 - HTTP - invites et collaboration
on:
  push:
    branches: ['qa/guest-http-browser', 'develop/**']
    paths:
      - 'apps/studio/collab/**'
      - 'apps/studio/service-worker.mjs'
      - 'apps/studio/client-bootstrap.js'
      - 'tests/browser/isolated-origin-guest.mjs'
      - 'tests/browser/isolated-server-guest.mjs'
      - 'tests/browser/collab-real-peers.mjs'
      - 'server/server.mjs'
      - '.github/workflows/guest-iframe-smoke.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: guest-iframe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: ./.github/actions/browser-tests
      - name: "Actual isolated guest preview: Chromium and Firefox"
        run: node tests/browser/isolated-origin-guest.mjs
      - name: "Real ALWIS dual-host server + guest cookie, fetch and POST"
        run: node tests/browser/isolated-server-guest.mjs
      - name: "Actual ALWIS server with two browsers, P2P/relay/reconnect/kick"
        run: node tests/browser/collab-real-peers.mjs
