name: Archive pinned source snapshots
on:
  push:
    branches: [main]
    paths:
      - 'provenance/*lock.json'
      - 'scripts/bundle-sources.py'
      - '.github/workflows/source-snapshots.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pinned-source-release
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover and verify all 19 original snapshots
        run: python3 scripts/bundle-sources.py
      - name: Publish verified archives in this private repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=sources-2026-10-31
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" \
              --title "Sources épinglées — préparation du 31 octobre 2026" \
              --notes "19 archives amont non modifiées : 17 dépôts et 2 sous-modules. Chaque taille et SHA-256 est vérifié contre les verrous importés avant publication. Extraire sources.zip à la racine du dépôt. Aucun moteur WASM n'a été compilé."
          fi
          gh release upload "$tag" deliverables/sources.zip deliverables/SHA256SUMS --clobber
