<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Journal · Scénarios de résistance</title><link rel="stylesheet" href="/apps/studio/studio.css"></head><body><main style="padding:24px;max-width:1200px;margin-inline:auto"><h1>Journal : scénarios de résistance</h1><p class="hint">Composant réel, données de démonstration uniquement. Cette page ne crée aucun projet et ne contacte pas le moteur. Essayez aussi Tab, le zoom et le contraste système.</p><div id="scenarios"></div></main><script type="module">
import {diagnosticCard} from './diagnostics-view.mjs';
const base={id:'EXEMPLE-001',time:'2026-11-01T12:00:00.000Z',level:'error',context:'Exemple de diagnostic',message:'La sauvegarde a échoué.',recovery:'Gardez cet onglet ouvert puis réessayez la sauvegarde.',details:'Exemple de détail technique, sans donnée de projet.'};
const scenarios=[
 ['Message vide',320,{message:'',level:'info'}],
 ['Erreur courante, largeur 320 px',320,{}],
 ['Mot très long sans espace',320,{message:'UnknownColumn_'+ 'nom_de_colonne_'.repeat(35)}],
 ['Plusieurs phrases',320,{message:'Une écriture a dépassé le quota du projet. La version déjà sauvegardée reste disponible. La requête a été refusée et les clients attendent la reprise.'}],
 ['Diacritiques et texte bidirectionnel',320,{message:'Écriture refusée : العربية · école / ملف.php · connexion PDO 🗂'}],
 ['Contexte long et détails complets',320,{context:'Projet pédagogique, session indépendante et requête SQL avec de nombreux paramètres',details:('SQLSTATE 42S22 : colonne inconnue dans la requête SELECT.\n').repeat(120)}],
 ['Avertissement',320,{level:'warning',message:'Le projet contient un brouillon non sauvegardé.'}],
 ['Information, un mot',320,{level:'info',message:'Enregistré',details:'',recovery:''}],
 ['Conteneur comprimé par un voisin',180,{message:'La requête SQL a été refusée.'}],
 ['Conteneur large',1080,{}]
];
for(const [label,width,props]of scenarios){const section=document.createElement('section');section.style.marginBlock='28px';const title=document.createElement('h2');title.textContent=label;const container=document.createElement('div');container.style.width=width+'px';container.style.maxWidth='100%';const card=diagnosticCard({...base,...props});card.open=true;container.append(card);section.append(title,container);document.querySelector('#scenarios').append(section);}
</script></body></html>
