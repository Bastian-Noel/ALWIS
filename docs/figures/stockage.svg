<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>Trois rôles dans le stockage local</title><desc>Les fichiers, le catalogue et le checkpoint ne sont pas trois copies complètes du projet.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#526674"/></marker></defs>
<rect x="0" y="0" width="1200" height="760" rx="12" fill="#ffffff" stroke="none"/>
<text x="48" y="46" fill="#087e79" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">ALWIS / GUIDE VISUEL</text>
<text x="48" y="112" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="42" font-weight="700">Trois rôles dans le stockage local</text>
<text x="48" y="159" fill="#526674" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">Les fichiers, le catalogue et le checkpoint ne sont pas trois copies complètes du projet.</text>
<path d="M48 189 H1152" stroke="#dbe3e8"/>
<rect x="48" y="272" width="336" height="248" rx="12" fill="#eaf7f3" stroke="none"/>
<rect x="48" y="272" width="5" height="248" rx="0" fill="#087e79" stroke="none"/>
<text x="72" y="315" fill="#087e79" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">OPFS</text>
<text x="72" y="360" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">Objets de fichiers sur</text>
<text x="72" y="393" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">le disque privé du</text>
<text x="72" y="426" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">navigateur.</text>
<path d="M392 396 L422 396" fill="none" stroke="#526674" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="432" y="272" width="336" height="248" rx="12" fill="#eef3ff" stroke="none"/>
<rect x="432" y="272" width="5" height="248" rx="0" fill="#245edb" stroke="none"/>
<text x="456" y="315" fill="#245edb" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">IndexedDB</text>
<text x="456" y="360" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">Catalogue et</text>
<text x="456" y="393" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">générations : quelles</text>
<text x="456" y="426" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">versions de fichiers</text>
<text x="456" y="459" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">composent le projet.</text>
<path d="M776 396 L806 396" fill="none" stroke="#526674" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="816" y="272" width="336" height="248" rx="12" fill="#f2f5f7" stroke="none"/>
<rect x="816" y="272" width="5" height="248" rx="0" fill="#526674" stroke="none"/>
<text x="840" y="315" fill="#526674" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">Checkpoint</text>
<text x="840" y="360" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">État de reprise SQL</text>
<text x="840" y="393" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">associé à une</text>
<text x="840" y="426" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">génération cohérente</text>
<text x="840" y="459" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">du catalogue.</text>
<text x="48" y="638" fill="#526674" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="24" font-weight="400">Un fichier inchangé peut être réutilisé ; une sauvegarde ne recharge pas tous les</text>
<text x="48" y="673" fill="#526674" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="24" font-weight="400">médias en RAM.</text>
<path d="M48 711 H1152" stroke="#dbe3e8"/>
<text x="48" y="743" fill="#526674" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400">Schéma explicatif · les captures d’interface sont présentées séparément</text>
<text x="1028" y="743" fill="#526674" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400">2026.11</text>
</svg>
