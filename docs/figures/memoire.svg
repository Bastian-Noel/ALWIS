<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>Disque, tas WASM et mémoire du navigateur</title><desc>Trois mesures distinctes : ne les additionnez pas sans connaître leur périmètre.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#526674"/></marker></defs>
<rect x="0" y="0" width="1200" height="760" rx="12" fill="#ffffff" stroke="none"/>
<text x="48" y="46" fill="#087e79" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">ALWIS / GUIDE VISUEL</text>
<text x="48" y="112" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="42" font-weight="700">Disque, tas WASM et mémoire du navigateur</text>
<text x="48" y="159" fill="#526674" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">Trois mesures distinctes : ne les additionnez pas sans connaître leur périmètre.</text>
<path d="M48 189 H1152" stroke="#dbe3e8"/>
<rect x="48" y="232" width="1104" height="108" rx="12" fill="#eaf7f3" stroke="none"/>
<rect x="48" y="232" width="5" height="108" rx="0" fill="#087e79" stroke="none"/>
<text x="72" y="275" fill="#087e79" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">Projet sur disque</text>
<text x="72" y="320" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">OPFS : taille des fichiers persistés, pas taille du tas PHP.</text>
<rect x="48" y="360" width="1104" height="108" rx="12" fill="#eef3ff" stroke="none"/>
<rect x="48" y="360" width="5" height="108" rx="0" fill="#245edb" stroke="none"/>
<text x="72" y="403" fill="#245edb" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">Mémoire linéaire WASM</text>
<text x="72" y="448" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">Allocation du moteur ; ce build démarre à 256 Mio, plafond 512 Mio.</text>
<rect x="48" y="488" width="1104" height="108" rx="12" fill="#fff5e5" stroke="none"/>
<rect x="48" y="488" width="5" height="108" rx="0" fill="#a96413" stroke="none"/>
<text x="72" y="531" fill="#a96413" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">Processus navigateur</text>
<text x="72" y="576" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">JavaScript, éditeurs, workers, buffers et autres allocations.</text>
<text x="48" y="638" fill="#526674" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="24" font-weight="400">Une limite de 2 Gio sur disque n’est pas une promesse de consommer 2 Gio de RAM.</text>
<path d="M48 711 H1152" stroke="#dbe3e8"/>
<text x="48" y="743" fill="#526674" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400">Schéma explicatif · les captures d’interface sont présentées séparément</text>
<text x="1028" y="743" fill="#526674" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400">2026.11</text>
</svg>
