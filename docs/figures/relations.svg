<text x="72" y="354" fill="#526674" font-family="ui-monospace,DejaVu Sans Mono,monospace" font-size="21" font-weight="400">id (PK)     name</text>
<text x="72" y="407" fill="#172b3a" font-family="ui-monospace,DejaVu Sans Mono,monospace" font-size="23" font-weight="400">1           3e Tilleul</text>
