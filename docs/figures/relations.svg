<text x="576" y="347" fill="#087e79" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">1:N</text>
<text x="48" y="603" fill="#526674" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="24" font-weight="400">Les deux élèves appartiennent à la même classe ; la clé étrangère évite un identifiant</text>
<text x="48" y="638" fill="#526674" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="24" font-weight="400">orphelin.</text>
<text x="48" y="673" fill="#526674" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="24" font-weight="400">La relation porte sur les clés, pas sur la position des lignes à l’écran.</text>
