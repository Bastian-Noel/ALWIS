<text x="674" y="354" fill="#526674" font-family="ui-monospace,DejaVu Sans Mono,monospace" font-size="21" font-weight="400">id     user_id     class_id (FK)</text>
<text x="674" y="407" fill="#172b3a" font-family="ui-monospace,DejaVu Sans Mono,monospace" font-size="23" font-weight="400">1      4           1</text>
