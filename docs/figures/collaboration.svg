<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>Partager l’exécution, pas une copie d’écran</title><desc>Le navigateur hôte conserve le projet ; l’invité reçoit des réponses HTTP.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#526674"/></marker></defs>
<rect x="0" y="0" width="1200" height="760" rx="12" fill="#ffffff" stroke="none"/>
<text x="48" y="46" fill="#087e79" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">ALWIS / GUIDE VISUEL</text>
<text x="48" y="112" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="42" font-weight="700">Partager l’exécution, pas une copie d’écran</text>
<text x="48" y="159" fill="#526674" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">Le navigateur hôte conserve le projet ; l’invité reçoit des réponses HTTP.</text>
<path d="M48 189 H1152" stroke="#dbe3e8"/>
<rect x="48" y="272" width="336" height="248" rx="12" fill="#eef3ff" stroke="none"/>
<rect x="48" y="272" width="5" height="248" rx="0" fill="#245edb" stroke="none"/>
<text x="72" y="315" fill="#245edb" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">Invité</text>
<text x="72" y="360" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">Sa page exécute son</text>
<text x="72" y="393" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">JavaScript et demande</text>
<text x="72" y="426" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">ses ressources au</text>
<text x="72" y="459" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">relais HTTP.</text>
<path d="M392 396 L422 396" fill="none" stroke="#526674" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="432" y="272" width="336" height="248" rx="12" fill="#f2f5f7" stroke="none"/>
<rect x="432" y="272" width="5" height="248" rx="0" fill="#526674" stroke="none"/>
<text x="456" y="315" fill="#526674" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">Transport</text>
<text x="456" y="360" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">WebRTC ou relais</text>
<text x="456" y="393" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">serveur ; contrôle des</text>
<text x="456" y="426" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">droits et requêtes</text>
<text x="456" y="459" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">bornées.</text>
<path d="M776 396 L806 396" fill="none" stroke="#526674" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="816" y="272" width="336" height="248" rx="12" fill="#eaf7f3" stroke="none"/>
<rect x="816" y="272" width="5" height="248" rx="0" fill="#087e79" stroke="none"/>
<text x="840" y="315" fill="#087e79" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">Hôte</text>
<text x="840" y="360" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">ProjectHub exécute PHP</text>
<text x="840" y="393" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">et SQL, puis renvoie</text>
<text x="840" y="426" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">une réponse</text>
<text x="840" y="459" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">normalisée.</text>
<text x="48" y="638" fill="#526674" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="24" font-weight="400">L’aperçu HTTP distant requiert une origine dédiée correctement configurée en HTTPS.</text>
<text x="48" y="673" fill="#526674" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="24" font-weight="400">Si l’hôte part, le lien ne devient pas un hébergement PHP permanent.</text>
<path d="M48 711 H1152" stroke="#dbe3e8"/>
<text x="48" y="743" fill="#526674" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400">Schéma explicatif · les captures d’interface sont présentées séparément</text>
<text x="1028" y="743" fill="#526674" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400">2026.11</text>
</svg>
