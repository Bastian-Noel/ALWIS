<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>Lire une colonne avant de modifier sa valeur</title><desc>Exemple pédagogique de définition SQL et de conséquences pour la saisie.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#526674"/></marker></defs>
<rect x="0" y="0" width="1200" height="760" rx="12" fill="#ffffff" stroke="none"/>
<text x="48" y="46" fill="#087e79" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">ALWIS / GUIDE VISUEL</text>
<text x="48" y="112" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="42" font-weight="700">Lire une colonne avant de modifier sa valeur</text>
<text x="48" y="159" fill="#526674" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">Exemple pédagogique de définition SQL et de conséquences pour la saisie.</text>
<path d="M48 189 H1152" stroke="#dbe3e8"/>
<rect x="48" y="240" width="1104" height="94" rx="12" fill="#eef3ff" stroke="none"/>
<text x="72" y="278" fill="#245edb" font-family="ui-monospace,DejaVu Sans Mono,monospace" font-size="26" font-weight="700">id INT PRIMARY KEY</text>
<text x="72" y="315" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">Identifie une ligne ; la clé doit rester unique.</text>
<rect x="48" y="356" width="1104" height="94" rx="12" fill="#eaf7f3" stroke="none"/>
<text x="72" y="394" fill="#087e79" font-family="ui-monospace,DejaVu Sans Mono,monospace" font-size="26" font-weight="700">score DECIMAL(4,2) NULL</text>
<text x="72" y="431" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">Deux décimales ; l’absence de note peut être NULL.</text>
<rect x="48" y="472" width="1104" height="94" rx="12" fill="#f2f5f7" stroke="none"/>
<text x="72" y="510" fill="#526674" font-family="ui-monospace,DejaVu Sans Mono,monospace" font-size="26" font-weight="700">comment VARCHAR(240) NOT NULL DEFAULT &#x27;&#x27;</text>
<text x="72" y="547" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">Un texte est requis ; sa valeur par défaut est une chaîne vide.</text>
<text x="48" y="638" fill="#526674" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="24" font-weight="400">DEFAULT, NULL et type sont trois propriétés différentes, à examiner séparément.</text>
<path d="M48 711 H1152" stroke="#dbe3e8"/>
<text x="48" y="743" fill="#526674" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400">Schéma explicatif · les captures d’interface sont présentées séparément</text>
<text x="1028" y="743" fill="#526674" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400">2026.11</text>
</svg>
