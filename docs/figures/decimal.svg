<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>DECIMAL : garder la précision du texte</title><desc>Exemple pédagogique : une valeur SQL précise n’est pas un flottant JavaScript.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#526674"/></marker></defs>
<rect x="0" y="0" width="1200" height="760" rx="12" fill="#ffffff" stroke="none"/>
<text x="48" y="46" fill="#087e79" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">ALWIS / GUIDE VISUEL</text>
<text x="48" y="112" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="42" font-weight="700">DECIMAL : garder la précision du texte</text>
<text x="48" y="159" fill="#526674" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">Exemple pédagogique : une valeur SQL précise n’est pas un flottant JavaScript.</text>
<path d="M48 189 H1152" stroke="#dbe3e8"/>
<rect x="48" y="228" width="1104" height="133" rx="12" fill="#eaf7f3" stroke="none"/>
<text x="80" y="280" fill="#087e79" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">DECIMAL(30,4)</text>
<text x="80" y="331" fill="#172b3a" font-family="ui-monospace,DejaVu Sans Mono,monospace" font-size="43" font-weight="400">9007199254740993.1234</text>
<rect x="48" y="415" width="510" height="170" rx="12" fill="#eaf7f3" stroke="none"/>
<rect x="48" y="415" width="5" height="170" rx="0" fill="#087e79" stroke="none"/>
<text x="72" y="458" fill="#087e79" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">Chaîne conservée</text>
<text x="72" y="503" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">La base reçoit les chiffres exacts,</text>
<text x="72" y="536" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">avec un paramètre lié.</text>
<rect x="642" y="415" width="510" height="170" rx="12" fill="#fff5e5" stroke="none"/>
<rect x="642" y="415" width="5" height="170" rx="0" fill="#a96413" stroke="none"/>
<text x="666" y="458" fill="#a96413" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">Conversion en flottant</text>
<text x="666" y="503" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">Un arrondi peut survenir avant même</text>
<text x="666" y="536" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">la requête SQL.</text>
<path d="M320 370 L320 402" fill="none" stroke="#526674" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M880 370 L880 402" fill="none" stroke="#526674" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="48" y="638" fill="#526674" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="24" font-weight="400">En PHP : liez cette valeur comme texte ; ne la convertissez pas d’abord en float.</text>
<path d="M48 711 H1152" stroke="#dbe3e8"/>
<text x="48" y="743" fill="#526674" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400">Schéma explicatif · les captures d’interface sont présentées séparément</text>
<text x="1028" y="743" fill="#526674" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400">2026.11</text>
