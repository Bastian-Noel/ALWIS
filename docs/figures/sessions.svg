<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>Deux identités, une même base</title><desc>Des cookies privés par visiteur ; des fichiers et tables partagés pour le projet.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#526674"/></marker></defs>
<rect x="0" y="0" width="1200" height="760" rx="12" fill="#ffffff" stroke="none"/>
<text x="48" y="46" fill="#087e79" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">ALWIS / GUIDE VISUEL</text>
<text x="48" y="112" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="42" font-weight="700">Deux identités, une même base</text>
<text x="48" y="159" fill="#526674" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">Des cookies privés par visiteur ; des fichiers et tables partagés pour le projet.</text>
<path d="M48 189 H1152" stroke="#dbe3e8"/>
<rect x="48" y="258" width="325" height="245" rx="12" fill="#eef3ff" stroke="none"/>
<rect x="48" y="258" width="5" height="245" rx="0" fill="#245edb" stroke="none"/>
<text x="72" y="301" fill="#245edb" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">Visiteur A</text>
<text x="72" y="346" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">Son identité et ses</text>
<text x="72" y="379" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">cookies. Exemple : le</text>
<text x="72" y="412" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">professeur.</text>
<rect x="442" y="258" width="325" height="245" rx="12" fill="#eaf7f3" stroke="none"/>
<rect x="442" y="258" width="5" height="245" rx="0" fill="#087e79" stroke="none"/>
<text x="466" y="301" fill="#087e79" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">Projet commun</text>
<text x="466" y="346" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">PHP et MariaDB chez</text>
<text x="466" y="379" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">le propriétaire du</text>
<text x="466" y="412" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">projet.</text>
<rect x="826" y="258" width="325" height="245" rx="12" fill="#f2f5f7" stroke="none"/>
<rect x="826" y="258" width="5" height="245" rx="0" fill="#526674" stroke="none"/>
<text x="850" y="301" fill="#526674" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700">Visiteur B</text>
<text x="850" y="346" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">Son identité et ses</text>
<text x="850" y="379" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">cookies. Exemple : un</text>
<text x="850" y="412" fill="#172b3a" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="23" font-weight="400">élève.</text>
<path d="M384 380 L428 380" fill="none" stroke="#526674" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M812 380 L780 380" fill="none" stroke="#526674" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="48" y="603" fill="#526674" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="24" font-weight="400">Un changement SQL peut être visible des deux visiteurs ; leurs connexions PHP restent</text>
<text x="48" y="638" fill="#526674" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="24" font-weight="400">distinctes.</text>
<text x="48" y="673" fill="#526674" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="24" font-weight="400">Les profils du Campus sont une démonstration, pas une authentification de production.</text>
<path d="M48 711 H1152" stroke="#dbe3e8"/>
<text x="48" y="743" fill="#526674" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400">Schéma explicatif · les captures d’interface sont présentées séparément</text>
<text x="1028" y="743" fill="#526674" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400">2026.11</text>
</svg>
